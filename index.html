<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hustle Culture | Strategic Scheduler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blur"></div>
    <main class="container">
        <header>
            <h1>The Hustle Culture</h1>
            <p class="subtitle">Dynamic Resource Allocation & Fatigue Management</p>
        </header>

        <section class="glass-card editor-section">
            <h3 class="section-title">Project Pipeline</h3>
            <div id="project-inputs">
                <div class="project-row">
                    <input type="text" placeholder="Project Name" class="p-name">
                    <input type="number" min="1" placeholder="Start Day" class="p-start">
                    <input type="number" min="1" placeholder="End Day" class="p-end">
                    <input type="number" min="0" placeholder="Daily Cost" class="p-cost">
                    <input type="number" min="0" placeholder="Total Reward" class="p-reward">
                </div>
            </div>
            <div class="button-group">
                <button id="add-project" class="btn-secondary">+ Add Project</button>
                <button id="calculate-btn" class="btn-primary">Optimize Schedule</button>
            </div>
        </section>

        <section id="results-area" class="results-hidden">
            <div class="glass-card">
                <div class="results-header">
                    <span>Optimized Net Gain</span>
                    <h2 id="total-reward-display">$0</h2>
                </div>
                
                <div class="grid-layout">
                    <div class="selection-box">
                        <h3 class="section-title">Selected Strategy</h3>
                        <ul id="selected-projects-list"></ul>
                    </div>
                    <div class="log-box">
                        <h3 class="section-title">Energy Performance Log</h3>
                        <div class="log-header">
                            <span>DAY</span><span>ENERGY FLOW</span><span>COST</span>
                        </div>
                        <div id="capacity-log"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
